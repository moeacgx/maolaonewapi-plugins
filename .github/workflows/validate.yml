name: Validate plugin source
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          fetch-depth: 0
      - name: Set up Node
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        with:
          node-version: "22"
      - name: Validate index and immutable releases
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          if [ -n "$BASE_SHA" ] && git cat-file -e "$BASE_SHA:index.json" 2>/dev/null; then
            git show "$BASE_SHA:index.json" > .base-index.json
            node scripts/validate-index.mjs --base .base-index.json
          else
            node scripts/validate-index.mjs
          fi
      - name: Test index validation
        run: node --test scripts/validate-index.test.mjs
      - name: Test Cloudflare Jev protocol
        run: node --test --test-timeout=60000 tests/cloudflare-jev.test.mjs
  cloudflare-host:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - host_ref: e94fb60a4edccb729a7a1dc6e254526a5972cbc7
            plugin_version: "0.2.3"
          - host_ref: ca5d5ebbd8d6658704ffdf7321d88cddc74165d2
            plugin_version: "0.2.4"
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
      - name: Set up Node
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        with:
          node-version: "22"
      - name: Check out verified host
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          repository: moeacgx/NewAPI-Mao
          ref: ${{ matrix.host_ref }}
          path: host
      - name: Set up Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16
        with:
          go-version-file: host/go.mod
          cache-dependency-path: |
            host/go.sum
            host/relaykit/go.sum
      - name: Replay fixtures and verify host contract
        env:
          CLOUDFLARE_JEV_PLUGIN_VERSION: ${{ matrix.plugin_version }}
        run: node scripts/verify-cloudflare-host.mjs host
      - name: Old host must reject the new plugin capability
        if: matrix.plugin_version == '0.2.3'
        env:
          CLOUDFLARE_JEV_PLUGIN_VERSION: "0.2.4"
          CLOUDFLARE_JEV_EXPECT_UNSUPPORTED_CAPABILITY: "1"
        run: node scripts/verify-cloudflare-host.mjs host
